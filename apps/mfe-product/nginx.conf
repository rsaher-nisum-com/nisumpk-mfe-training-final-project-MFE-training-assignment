server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Lets the gateway (a different origin/container) fetch remoteEntry.js and
  # its chunks - Module Federation remotes are loaded cross-origin from the browser.
  add_header Access-Control-Allow-Origin *;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
